name: Dependabot Slack Report

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday: high and critical alerts
    - cron: "0 7 * * 2-5" # Tuesday-Friday: critical alerts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository list
        uses: actions/checkout@v4

      - name: Read repository list
        id: repositories
        run: echo "repositories=$(jq -r '.repositories | join(",")' system.json)" >> "$GITHUB_OUTPUT"

      - name: Create access token restricted to given repositories
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNERABILITY_REPORTER_APP_ID }}
          private-key: ${{ secrets.VULNERABILITY_REPORTER_PRIVATE_KEY }}
          owner: olavlan-ssb
          repositories: ${{ steps.repositories.outputs.repositories }}

      - name: Send high and critical Dependabot vulnerabilities to Slack
        uses: actions/github-script@v8
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SEVERITY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 2-5' && 'critical' || 'high,critical' }}
        with:
           github-token: ${{ steps.app-token.outputs.token }}
           script: |
            const { repositories } = require("./system.json");
            for (const repo of repositories) {
              await reportRepositoryVulnerabilities(repo);
            }

            async function reportRepositoryVulnerabilities(repo) {
              const alerts = await github.paginate(
                github.rest.dependabot.listAlertsForRepo,
                {
                  owner: "olavlan-ssb",
                  repo,
                  state: "open",
                  severity: process.env.SEVERITY,
                  per_page: 100,
                },
              );

              if (alerts.length === 0) {
                console.log(`No high/critical Dependabot alerts for ${repo}.`);
                return;
              }

              const critical = alerts.filter(
                (alert) => alert.security_advisory?.severity === "critical",
              );
              const high = alerts.filter(
                (alert) => alert.security_advisory?.severity === "high",
              );

              const formatAlert = (alert) => {
                const dependabotLink = `<${alert.html_url}|${alert.dependency.package.name}>`;
                const fixed = alert.security_vulnerability?.first_patched_version?.identifier;
                const fixedText = fixed ? `, fixed in ${fixed}` : "no fix";
                return `- ${dependabotLink}${fixedText}`;
              };

              const blocks = [
                {
                  type: "header",
                  text: { type: "plain_text", text: `olavlan-ssb/${repo}` },
                },
              ];

              const attachments = [];

              for (const [severity, severityAlerts] of [["Critical", critical], ["High", high]]) {
                if (severityAlerts.length > 0) {
                  attachments.push({
                    color: severity === "Critical" ? "#e01e5a" : "#ecb22e",
                    blocks: [
                      {
                        type: "section",
                        text: {
                          type: "mrkdwn",
                          text: severityAlerts.map(formatAlert).join("\n"),
                        },
                      },
                    ],
                  });
                }
              }

              if (attachments.length === 0) {
                return;
              }

              const response = await fetch(process.env.SLACK_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ blocks, attachments }),
              });

              if (!response.ok) {
                throw new Error(
                  `Slack returned ${response.status}: ${await response.text()}`,
                );
              }
            }
